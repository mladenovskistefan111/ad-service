plugins {
    id 'com.google.protobuf' version '0.9.6'
    id 'idea'
    id 'application'
}

repositories {
    mavenCentral()
}

description = 'Ad Service'
group       = 'adservice'
version     = '1.0.0'

def grpcVersion        = '1.79.0'
def protocVersion      = '4.34.0'
def otelVersion        = '1.49.0'
def otelInstrVersion   = '2.16.0'
def micrometerVersion  = '1.12.5'
def pyroscopeVersion   = '0.14.0'

tasks.withType(JavaCompile) {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    // gRPC
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-netty:${grpcVersion}"
    implementation "io.grpc:grpc-services:${grpcVersion}"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
    implementation "com.google.protobuf:protobuf-java:${protocVersion}"
    implementation "com.google.guava:guava:33.4.8-jre"

    // OpenTelemetry — tracing
    implementation "io.opentelemetry:opentelemetry-api:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-exporter-otlp:${otelVersion}"
    implementation "io.opentelemetry.semconv:opentelemetry-semconv:1.25.0-alpha"
    implementation "io.opentelemetry.instrumentation:opentelemetry-grpc-1.6:2.9.0-alpha"
    implementation "io.opentelemetry:opentelemetry-extension-trace-propagators:${otelVersion}"

    // Micrometer — Prometheus metrics
    implementation "io.micrometer:micrometer-registry-prometheus:${micrometerVersion}"

    // Pyroscope — continuous profiling
    implementation "io.pyroscope:agent:${pyroscopeVersion}"

    // Logging
    implementation "org.apache.logging.log4j:log4j-core:2.25.0"
    implementation "org.apache.logging.log4j:log4j-layout-template-json:2.25.0"

    runtimeOnly "io.netty:netty-tcnative-boringssl-static:2.0.75.Final"
    runtimeOnly "com.fasterxml.jackson.core:jackson-databind:2.19.0"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testImplementation "io.micrometer:micrometer-registry-prometheus:${micrometerVersion}"
}

test {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/java'
            srcDirs 'build/generated/source/proto/main/grpc'
        }
        proto {
            srcDir 'src/main/proto'
        }
    }
}

application {
    mainClass = 'hipstershop.AdService'
}

jar {
    manifest {
        attributes 'Main-Class': 'hipstershop.AdService'
    }
}

startScripts.enabled = false

task adService(type: CreateStartScripts) {
    mainClass.set('hipstershop.AdService')
    applicationName = 'AdService'
    outputDir = new File(project.buildDir, 'tmp')
    classpath = startScripts.classpath
}

applicationDistribution.into('bin') {
    from(adService)
    fileMode = 0755
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}