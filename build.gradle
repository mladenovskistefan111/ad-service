plugins {
    id 'com.google.protobuf' version '0.10.0'
    id 'idea'
    id 'application'
}

repositories {
    mavenCentral()
}

description = 'Ad Service'
group       = 'adservice'
version     = '1.0.0'

def grpcVersion        = '1.84.2'
def protocVersion      = '4.36.2'
def otelVersion        = '1.67.0'
def otelInstrVersion   = '2.16.0'
def pyroscopeVersion   = '0.14.0'

tasks.withType(JavaCompile) {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Force all transitive Netty deps to a patched version (Trivy HIGH/CRITICAL, fixed in 4.1.137.Final)
configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'io.netty'
                && !details.requested.name.contains('tcnative')) {
            details.useVersion '4.1.137.Final'
            details.because 'CVE-2026-75595, CVE-2026-44249, CVE-2026-45416, CVE-2026-50010 fixed in 4.1.137.Final'
        }
        if (details.requested.group == 'com.fasterxml.jackson.core'
                && details.requested.name != 'jackson-annotations') {
            details.useVersion '2.21.7'
            details.because 'jackson-core/databind HIGH CVEs fixed in 2.21.7'
        }
    }
}

dependencies {
    // gRPC
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-netty:${grpcVersion}"
    implementation "io.grpc:grpc-services:${grpcVersion}"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
    implementation "com.google.protobuf:protobuf-java:${protocVersion}"
    implementation "com.google.guava:guava:33.7.2-jre"

    // OpenTelemetry — traces, metrics and logs over OTLP/gRPC
    implementation "io.opentelemetry:opentelemetry-api:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-exporter-otlp:${otelVersion}"
    implementation "io.opentelemetry.semconv:opentelemetry-semconv:1.44.0"
    implementation "io.opentelemetry.instrumentation:opentelemetry-grpc-1.6:2.32.0-alpha"
    implementation "io.opentelemetry:opentelemetry-extension-trace-propagators:${otelVersion}"
    // Logs — forwards Log4j2 records (with trace ids) to the OTel logs pipeline
    implementation "io.opentelemetry.instrumentation:opentelemetry-log4j-appender-2.17:2.32.0-alpha"

    // Pyroscope — continuous profiling
    implementation "io.pyroscope:agent:${pyroscopeVersion}"

    // Logging
    implementation "org.apache.logging.log4j:log4j-core:2.26.1"
    implementation "org.apache.logging.log4j:log4j-layout-template-json:2.26.1"

    runtimeOnly "io.netty:netty-tcnative-boringssl-static:2.0.84.Final"
    runtimeOnly "com.fasterxml.jackson.core:jackson-databind:2.22.3"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
}

test {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/java'
            srcDirs 'build/generated/source/proto/main/grpc'
        }
        proto {
            srcDir 'src/main/proto'
        }
    }
}

application {
    mainClass = 'hipstershop.AdService'
}

jar {
    manifest {
        attributes 'Main-Class': 'hipstershop.AdService'
    }
}

startScripts.enabled = false

task adService(type: CreateStartScripts) {
    mainClass.set('hipstershop.AdService')
    applicationName = 'AdService'
    outputDir = new File(project.buildDir, 'tmp')
    classpath = startScripts.classpath
}

applicationDistribution.into('bin') {
    from(adService)
    fileMode = 0755
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}